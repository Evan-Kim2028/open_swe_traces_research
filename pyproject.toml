[project]
name = "open-swe-traces-research"
version = "0.1.0"
description = "Local analytics on NVIDIA Open-SWE-Traces agent trajectories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "huggingface-hub>=1.32.0",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
openswe-download = "openswe_traces.download:main"
openswe-verify = "openswe_traces.verify:main"
openswe-features = "openswe_traces.features:main_proxy_features"
openswe-sample = "openswe_traces.sft.sample:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openswe_traces"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
